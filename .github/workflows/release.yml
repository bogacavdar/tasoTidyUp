name: Windows ve Android sürümü

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot ve export şablonlarını indir
        run: |
          V=${GODOT_VERSION}-stable
          wget -q https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          unzip -q Godot_v${V}_linux.x86_64.zip
          mv Godot_v${V}_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${V}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.zip *.tpz

      - name: Android imzalama anahtarı ve editör ayarları
        run: |
          keytool -genkeypair -v -keystore $HOME/taso.keystore -storepass tasodukkani -alias taso \
            -keypass tasodukkani -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Taso Dukkani,O=Taso,C=TR"
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/taso.keystore\""
              echo 'export/android/debug_keystore_user = "taso"'
              echo 'export/android/debug_keystore_pass = "tasodukkani"'
            } > ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/taso.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=taso" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=tasodukkani" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/taso.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=taso" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=tasodukkani" >> $GITHUB_ENV

      - name: Projeyi içe aktar
        run: timeout 180 ./godot --headless --editor --quit || true

      - name: Windows export
        run: |
          mkdir -p build/windows
          ./godot --headless --export-release "Windows" build/windows/TasoDukkani.exe
          test -f build/windows/TasoDukkani.exe
          cd build/windows && zip -q -r ../TasoDukkani-Windows.zip .

      - name: Android export
        run: |
          mkdir -p build/android
          ./godot --headless --export-release "Android" build/android/TasoDukkani.apk
          test -f build/android/TasoDukkani.apk
          cp build/android/TasoDukkani.apk build/TasoDukkani-Android.apk

      - name: GitHub Release'i güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release delete son-surum --cleanup-tag -y || true
          gh release create son-surum \
            build/TasoDukkani-Windows.zip build/TasoDukkani-Android.apk \
            --title "Son sürüm ($SHORT)" \
            --notes "main dalındaki son değişikliklerden otomatik oluşturuldu ($SHORT).

          - **Windows:** TasoDukkani-Windows.zip dosyasını indir, klasöre çıkar, TasoDukkani.exe'yi çalıştır. İmzasız olduğu için SmartScreen uyarı verirse 'Ek bilgi' > 'Yine de çalıştır'.
          - **Android:** TasoDukkani-Android.apk dosyasını telefona indir ve kur (bilinmeyen kaynaklara izin vermen gerekebilir). Yeni sürüm kurmadan önce eskisini kaldır.
          - **Tarayıcı:** https://bogacavdar.github.io/tasoTidyUp/" \
            --prerelease --target "$GITHUB_SHA"
